# ============================================================================
# DEPRECATED — data collection has moved to hevi-se/linjelogg.
#
# The nightly fetch AND the HTML report generation now live in the linjelogg
# repository (.github/workflows/daily.yml), which fetches the latest day,
# regenerates index.html with all historical data, and publishes the site.
#
# The schedule has been removed so the two repositories don't fetch the same
# data in parallel and diverge. This file is kept only as a manual escape
# hatch (workflow_dispatch) and can be deleted once the move is confirmed.
# ============================================================================
name: Daily Data Fetch (DEPRECATED — moved to linjelogg)

on:
  workflow_dispatch:        # Endast manuell körning; ingen schemalagd trigger längre

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Behövs för att pusha data-CSV:er tillbaka till repot

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full historik så att git push fungerar korrekt

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q pandas requests py7zr plotly gtfs-realtime-bindings

      - name: Run daily fetch
        env:
          KODA_API_KEY: ${{ secrets.KODA_API_KEY }}
        run: python fetch_all.py
