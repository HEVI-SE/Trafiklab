# ============================================================================
# DEPRECATED — data collection has moved to hevi-se/linjelogg.
#
# Historical back-filling is complete and the live pipeline now lives in the
# linjelogg repository (.github/workflows/daily.yml). The schedule has been
# removed so the two repositories don't fetch in parallel and diverge. This
# file is kept only as a manual escape hatch (workflow_dispatch).
# ============================================================================
name: Historical Data Fetch (DEPRECATED — moved to linjelogg)

on:
  workflow_dispatch:        # Endast manuell körning; ingen schemalagd trigger längre

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q pandas requests py7zr plotly gtfs-realtime-bindings

      - name: Fetch next 3 historical days
        env:
          KODA_API_KEY: ${{ secrets.KODA_API_KEY }}
        run: python fetch_historical.py
